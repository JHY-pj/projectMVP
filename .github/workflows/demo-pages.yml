name: Build and publish static demo

on:
  push:
    branches:
      - demo-pages
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-static-demo
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static GitHub Pages demo
        run: npm run build:pages
        env:
          VITE_STATIC_DEMO: "true"
      - name: Verify static output
        run: |
          test -s dist-pages/index.html
          cp dist-pages/index.html dist-pages/404.html
          touch dist-pages/.nojekyll
      - name: Publish output to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-pages
          publish_branch: gh-pages
          force_orphan: true
